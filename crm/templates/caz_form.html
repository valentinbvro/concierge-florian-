{% extends "base.html" %}
{% block title %}Caz nou{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">Caz nou</h1>
<form method="post" action="/cazuri/nou" class="bg-white rounded shadow p-6 max-w-2xl space-y-4">
  <div><label class="block text-sm font-medium mb-1">Subiect *</label>
    <input name="subject" required class="w-full border rounded px-3 py-2"></div>
  <div><label class="block text-sm font-medium mb-1">Descriere</label>
    <textarea name="description" rows="4" class="w-full border rounded px-3 py-2"></textarea></div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Status</label>
      <select name="status" class="w-full border rounded px-3 py-2">
      {% for k,l in case_status %}<option value="{{ k }}">{{ l }}</option>{% endfor %}</select></div>
    <div><label class="block text-sm font-medium mb-1">Prioritate</label>
      <select name="priority" class="w-full border rounded px-3 py-2">
      {% for k,l in priorities %}<option value="{{ k }}" {% if k=='medie' %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Firmă</label>
      <select name="account_id" class="w-full border rounded px-3 py-2"><option value="">—</option>
      {% for f in firme %}<option value="{{ f.id }}">{{ f.name }}</option>{% endfor %}</select></div>
    <div><label class="block text-sm font-medium mb-1">Contact</label>
      <select name="contact_id" class="w-full border rounded px-3 py-2"><option value="">—</option>
      {% for c in contacte %}<option value="{{ c.id }}">{{ c.full_name }}</option>{% endfor %}</select></div>
  </div>
  <div><label class="block text-sm font-medium mb-1">Responsabil</label>
    <select name="owner_id" class="w-full border rounded px-3 py-2">
    {% for u in users %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}</select></div>
  <div class="flex gap-2">
    <button class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">Salvează</button>
    <a href="/cazuri" class="bg-gray-200 px-5 py-2 rounded hover:bg-gray-300">Renunță</a>
  </div>
</form>
{% endblock %}
