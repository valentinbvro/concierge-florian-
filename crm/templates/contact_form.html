{% extends "base.html" %}
{% block title %}{% if contact %}Editează contact{% else %}Contact nou{% endif %}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if contact %}Editează contactul{% else %}Contact nou{% endif %}</h1>
<form method="post" action="{% if contact %}/contacte/{{ contact.id }}/editeaza{% else %}/contacte/nou{% endif %}" class="bg-white rounded shadow p-6 max-w-2xl space-y-4">
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Prenume *</label>
      <input name="first_name" required value="{{ contact.first_name if contact else '' }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Nume *</label>
      <input name="last_name" required value="{{ contact.last_name if contact else '' }}" class="w-full border rounded px-3 py-2"></div>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" value="{{ contact.email if contact else '' }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Telefon</label>
      <input name="phone" value="{{ contact.phone if contact else '' }}" class="w-full border rounded px-3 py-2"></div>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Funcție</label>
      <input name="title" value="{{ contact.title if contact else '' }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Firmă</label>
      <select name="account_id" class="w-full border rounded px-3 py-2">
        <option value="">— fără firmă —</option>
        {% for f in firme %}<option value="{{ f.id }}" {% if contact and contact.account_id==f.id %}selected{% endif %}>{{ f.name }}</option>{% endfor %}
      </select></div>
  </div>
  <div><label class="block text-sm font-medium mb-1">Responsabil</label>
    <select name="owner_id" class="w-full border rounded px-3 py-2">
      {% for u in users %}<option value="{{ u.id }}" {% if contact and contact.owner_id==u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
    </select></div>
  <div class="flex gap-2">
    <button class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">Salvează</button>
    <a href="{% if contact %}/contacte/{{ contact.id }}{% else %}/contacte{% endif %}" class="bg-gray-200 px-5 py-2 rounded hover:bg-gray-300">Renunță</a>
  </div>
</form>
{% endblock %}
