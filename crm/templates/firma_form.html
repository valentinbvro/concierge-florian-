{% extends "base.html" %}
{% block title %}{% if firma %}Editează firmă{% else %}Firmă nouă{% endif %}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if firma %}Editează firma{% else %}Firmă nouă{% endif %}</h1>
<form method="post" action="{% if firma %}/firme/{{ firma.id }}/editeaza{% else %}/firme/nou{% endif %}" class="bg-white rounded shadow p-6 max-w-2xl space-y-4">
  <div><label class="block text-sm font-medium mb-1">Nume firmă *</label>
    <input name="name" required value="{{ firma.name if firma else '' }}" class="w-full border rounded px-3 py-2"></div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Industrie</label>
      <input name="industry" value="{{ firma.industry if firma else '' }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Website</label>
      <input name="website" value="{{ firma.website if firma else '' }}" class="w-full border rounded px-3 py-2"></div>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Telefon</label>
      <input name="phone" value="{{ firma.phone if firma else '' }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" value="{{ firma.email if firma else '' }}" class="w-full border rounded px-3 py-2"></div>
  </div>
  <div><label class="block text-sm font-medium mb-1">Adresă</label>
    <input name="address" value="{{ firma.address if firma else '' }}" class="w-full border rounded px-3 py-2"></div>
  <div><label class="block text-sm font-medium mb-1">Responsabil</label>
    <select name="owner_id" class="w-full border rounded px-3 py-2">
      {% for u in users %}<option value="{{ u.id }}" {% if firma and firma.owner_id==u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
    </select></div>
  <div class="flex gap-2">
    <button class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">Salvează</button>
    <a href="{% if firma %}/firme/{{ firma.id }}{% else %}/firme{% endif %}" class="bg-gray-200 px-5 py-2 rounded hover:bg-gray-300">Renunță</a>
  </div>
</form>
{% endblock %}
