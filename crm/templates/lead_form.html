{% extends "base.html" %}
{% block title %}{% if lead %}Editează lead{% else %}Lead nou{% endif %}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if lead %}Editează leadul{% else %}Lead nou{% endif %}</h1>
<form method="post" action="{% if lead %}/leaduri/{{ lead.id }}/editeaza{% else %}/leaduri/nou{% endif %}" class="bg-white rounded shadow p-6 max-w-2xl space-y-4">
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Prenume *</label>
      <input name="first_name" required value="{{ lead.first_name if lead else '' }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Nume *</label>
      <input name="last_name" required value="{{ lead.last_name if lead else '' }}" class="w-full border rounded px-3 py-2"></div>
  </div>
  <div><label class="block text-sm font-medium mb-1">Firmă</label>
    <input name="company" value="{{ lead.company if lead else '' }}" class="w-full border rounded px-3 py-2"></div>
  <div class="grid grid-cols-2 gap-4">
    <div><label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" value="{{ lead.email if lead else '' }}" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Telefon</label>
      <input name="phone" value="{{ lead.phone if lead else '' }}" class="w-full border rounded px-3 py-2"></div>
  </div>
  <div class="grid grid-cols-3 gap-4">
    <div><label class="block text-sm font-medium mb-1">Status</label>
      <select name="status" class="w-full border rounded px-3 py-2">
        {% for k,l in lead_status %}<option value="{{ k }}" {% if lead and lead.status==k %}selected{% endif %}>{{ l }}</option>{% endfor %}
      </select></div>
    <div><label class="block text-sm font-medium mb-1">Sursă</label>
      <input name="source" value="{{ lead.source if lead else '' }}" placeholder="Website, Târg…" class="w-full border rounded px-3 py-2"></div>
    <div><label class="block text-sm font-medium mb-1">Responsabil</label>
      <select name="owner_id" class="w-full border rounded px-3 py-2">
        {% for u in users %}<option value="{{ u.id }}" {% if lead and lead.owner_id==u.id %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
      </select></div>
  </div>
  <div><label class="block text-sm font-medium mb-1">Notițe</label>
    <textarea name="notes" rows="3" class="w-full border rounded px-3 py-2">{{ lead.notes if lead else '' }}</textarea></div>
  <div class="flex gap-2">
    <button class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">Salvează</button>
    <a href="{% if lead %}/leaduri/{{ lead.id }}{% else %}/leaduri{% endif %}" class="bg-gray-200 px-5 py-2 rounded hover:bg-gray-300">Renunță</a>
  </div>
</form>
{% endblock %}
