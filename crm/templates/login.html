<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autentificare — CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
<div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-sm">
  <h1 class="text-2xl font-bold mb-1">CRM</h1>
  <p class="text-gray-500 text-sm mb-6">Autentifică-te pentru a continua</p>
  {% if error %}
  <div class="bg-red-100 text-red-700 px-3 py-2 rounded mb-4 text-sm">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border rounded px-3 py-2" placeholder="email@exemplu.ro">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Parolă</label>
      <input type="password" name="password" required class="w-full border rounded px-3 py-2" placeholder="••••••••">
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 font-semibold">Intră în cont</button>
  </form>
  <div class="mt-6 text-xs text-gray-500 bg-gray-50 rounded p-3">
    <div class="font-semibold mb-1">Conturi demo:</div>
    <div>admin@demo.ro / admin123 (administrator)</div>
    <div>maria@demo.ro / maria123 (vânzări)</div>
    <div>ion@demo.ro / ion123 (suport)</div>
  </div>
</div>
</body>
</html>
